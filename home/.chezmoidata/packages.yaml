packages:
  endeavouros:
    yay:
      # Development tools
      - git
      - visual-studio-code-bin
      - starship
      - rclone
      - bitwarden-cli

      # Security
      - wireguard-tools
      - clamav
      - clamtk
   
      # Browsers and applications
      - firefox
      - spotify
      - zotero-bin
      - obsidian
      - onlyoffice-bin
      - bitwarden
      - vlc

      # mail
      - evolution-ews
      
      # Terminal emulators
      - alacritty
      
      # Appearance and theming
      - nwg-look
      - font-manager

      # Audio (PipeWire)
      - pipewire-alsa
      - pipewire-jack
      - pipewire-pulse
      - pavucontrol

      # Fonts
      - ttf-noto-nerd

    # Hyprland-specific packages (only install on hyprland branch)
    hyprland:
      # Core Hyprland packages
      - hyprland
      - hyprlock
      - hypridle
      - hyprpaper
      - hyprshot
      - hyprsunset
      
      # Wayland/compositor support
      - xdg-desktop-portal-hyprland
      
      # Window management and UI
      - rofi-wayland
      - wofi
      - waybar
      - swaync
      - dunst
      - swww
      
      # System utilities (not included in GNOME by default)
      - brightnessctl

      # Network and Bluetooth management (GNOME has these built-in)
      - networkmanager
      - nm-connection-editor
      - blueman

